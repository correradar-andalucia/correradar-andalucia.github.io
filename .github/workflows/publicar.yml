name: Actualizar carreras y publicar web
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar captación, calidad y duplicados antes de publicar
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check assets/app.js
      - name: Generar web y fichas de carreras
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python scripts/build.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web generada
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
