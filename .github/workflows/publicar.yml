name: Actualizar carreras y publicar web
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      estado: ${{ steps.continuidad.outputs.estado }}
      intento: ${{ steps.continuidad.outputs.intento }}
      artefacto: ${{ steps.pages.outputs.artifact_id }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar captación, calidad y duplicados antes de publicar
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check assets/app.js
      - name: Resolver referencia del último calendario publicado
        id: continuidad
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicacion.py resolver "$RUNNER_TEMP/calendario-previo.json"
      - name: Generar web y fichas de carreras
        env:
          CORRERADAR_DISTANCE_ENRICHMENT: ${{ vars.CORRERADAR_DISTANCE_ENRICHMENT || 'yes' }}
          CORRERADAR_PREVIOUS_CALENDAR: ${{ runner.temp }}/calendario-previo.json
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          GLOBALTEMPO_AUTHORIZED: ${{ vars.GLOBALTEMPO_AUTHORIZED }}
          GLOBALTEMPO_FEED_HOST: ${{ vars.GLOBALTEMPO_FEED_HOST }}
          GLOBALTEMPO_FEED_URL: ${{ secrets.GLOBALTEMPO_FEED_URL }}
          GLOBALTEMPO_FEED_TOKEN: ${{ secrets.GLOBALTEMPO_FEED_TOKEN }}
        run: python scripts/build.py
      - name: Comprobar informe, fichas y bloqueo de indexación
        run: python scripts/verificar_salida.py
      - name: Identificar y validar el calendario que se va a publicar
        run: python scripts/publicacion.py marcar _site/data/carreras.json
      - name: Subir calendario del intento
        uses: actions/upload-artifact@v4
        with:
          name: calendario-publicacion-${{ github.run_attempt }}
          path: _site/data/carreras.json
          retention-days: 7
          if-no-files-found: error
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web generada
        id: pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código del despliegue
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar calendario del intento
        uses: actions/download-artifact@v4
        with:
          name: calendario-publicacion-${{ needs.build.outputs.intento }}
          path: _publicacion
      - name: Publicar en GitHub Pages y confirmar la copia de continuidad
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTO: ${{ needs.build.outputs.artefacto }}
          ESTADO: ${{ needs.build.outputs.estado }}
          INTENTO: ${{ needs.build.outputs.intento }}
        run: |
          python scripts/publicacion.py desplegar _publicacion/carreras.json \
            --artefacto "$ARTEFACTO" --estado "$ESTADO" --intento "$INTENTO"

  avisos:
    # NUNCA avisar de carreras que no se hayan publicado correctamente.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Obtener código de notificaciones
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar que este intento sigue publicado
        env:
          INTENTO: ${{ needs.build.outputs.intento }}
        run: python scripts/publicacion.py avisos --intento "$INTENTO"
      - name: Recuperar calendario recién publicado
        uses: actions/download-artifact@v4
        with:
          name: calendario-publicacion-${{ needs.build.outputs.intento }}
          path: _avisos
      - name: Recuperar histórico de carreras notificadas
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/estado-correradar-avisos >/dev/null; then
            git fetch --quiet origin refs/heads/estado-correradar-avisos:refs/remotes/origin/estado-correradar-avisos
            git show refs/remotes/origin/estado-correradar-avisos:estado.json > "$RUNNER_TEMP/estado-anterior.json"
          else
            code=$?
            if [ "$code" -ne 2 ]; then
              echo "No se pudo consultar el histórico. Se detienen los avisos para no reiniciarlo por error."
              exit "$code"
            fi
            echo "Primer seguimiento: el calendario existente será el punto de partida."
          fi
      - name: Detectar carreras nuevas sin crear correos directamente
        run: |
          python scripts/notificar_carreras.py \
            --calendario _avisos/carreras.json \
            --estado-anterior "$RUNNER_TEMP/estado-anterior.json" \
            --estado-siguiente "$RUNNER_TEMP/estado-siguiente.json" \
            --aviso-titulo "$RUNNER_TEMP/aviso-titulo.txt" \
            --aviso-cuerpo "$RUNNER_TEMP/aviso-cuerpo.md"
      - name: Abrir incidencia de novedades para notificaciones GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/aviso-cuerpo.md" ]; then
            echo "Sin carreras nuevas: no se crea ninguna incidencia."
            exit 0
          fi
          marker=$(grep -oE 'correradar-avisos:[a-f0-9]{24}' "$RUNNER_TEMP/aviso-cuerpo.md" | head -1)
          test -n "$marker" || (echo "No se encontró identificador anti-duplicados" && exit 1)
          # Separar el acceso al historial de la decisión: un error de API
          # nunca debe interpretarse como «incidencia inexistente».
          gh issue list --repo "$GH_REPO" --state all --limit 1000 --json body > "$RUNNER_TEMP/incidencias.json"
          duplicate=$(jq -r --arg mark "$marker" 'if type != "array" then error("Historial inválido") else any(.[]; (.body // "") | contains($mark)) end' "$RUNNER_TEMP/incidencias.json")
          if [ "$duplicate" = "true" ]; then
            echo "La incidencia del lote ya existe; no repetir."
          elif [ "$duplicate" = "false" ]; then
            gh issue create --repo "$GH_REPO" \
              --title "$(cat "$RUNNER_TEMP/aviso-titulo.txt")" \
              --body-file "$RUNNER_TEMP/aviso-cuerpo.md"
            echo "Incidencia creada. GitHub notificará a quienes sigan Issues por email."
          else
            echo "No se pudo determinar si existe aviso previo."
            exit 1
          fi
      - name: Guardar histórico solo tras registrar las incidencias
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/estado-siguiente.json" ]; then
            echo "Estado incompleto; no se actualizará el histórico."
            exit 0
          fi
          if git show-ref --verify --quiet refs/remotes/origin/estado-correradar-avisos; then
            git switch --quiet -C estado-correradar-avisos refs/remotes/origin/estado-correradar-avisos
          else
            git switch --quiet --orphan estado-correradar-avisos
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/estado-siguiente.json" estado.json
          git add estado.json
          if git diff --cached --quiet; then
            echo "El histórico de carreras ya estaba actualizado."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Estado de avisos de carreras publicadas"
          git push --quiet origin HEAD:refs/heads/estado-correradar-avisos
          echo "Histórico de avisos guardado."
