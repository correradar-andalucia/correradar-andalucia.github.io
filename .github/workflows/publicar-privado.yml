# NO se ejecuta hasta configurar PRIVATE_DEPLOY_ENABLED=true.
# Todo el calendario se incluye dentro del Worker, sin publicar assets abiertos.
name: Actualizar calendario privado en Cloudflare
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */12 * * *'

permissions:
  contents: read

concurrency:
  group: calendario-privado
  cancel-in-progress: false

jobs:
  privado:
    if: ${{ vars.PRIVATE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar captación, filtros y control de acceso
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check assets/app.js
          node --check private/worker.mjs
      - name: Generar calendario privado
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          GLOBALTEMPO_AUTHORIZED: ${{ vars.GLOBALTEMPO_AUTHORIZED }}
          GLOBALTEMPO_FEED_HOST: ${{ vars.GLOBALTEMPO_FEED_HOST }}
          GLOBALTEMPO_FEED_URL: ${{ secrets.GLOBALTEMPO_FEED_URL }}
          GLOBALTEMPO_FEED_TOKEN: ${{ secrets.GLOBALTEMPO_FEED_TOKEN }}
        run: |
          python scripts/build.py
          python scripts/verificar_salida.py
          python scripts/pack_private_worker.py
      - name: Comprobar credenciales de despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Desplegar Worker con protección de identidad
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
